<html lang="vi">
<head>
<meta charset="UTF-8">

<body>
<header class="topbar">
  <div class="logo">
    <svg width="27" height="27" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
      <rect x="4.3" y="5.1" width="16" height="22" rx="2.8" transform="rotate(-10 4.3 5.1)" fill="#d7ecee" stroke="#fff" stroke-width="1.4"/>
      <rect x="9.5" y="3.6" width="15" height="21" rx="2.6" transform="rotate(8 9.5 3.6)" fill="#fff" stroke="#b9d8db" stroke-width="1.2"/>
      <path d="m17 7.4-2.4 2.8L17 13l2.4-2.8L17 7.4Z" fill="#d84b55"/>
      <rect x="14" y="14" width="15" height="15" rx="3" fill="#ffd75e" stroke="#fff" stroke-width="1.3"/>
      <g fill="#12535c">
        <circle cx="18" cy="18" r="1.15"/>
        <circle cx="25" cy="18" r="1.15"/>
        <circle cx="21.5" cy="21.5" r="1.15"/>
        <circle cx="18" cy="25" r="1.15"/>
        <circle cx="25" cy="25" r="1.15"/>
      </g>
    </svg>
    Table Game
  </div>
  <div class="top-right">
    <div class="chip-tools">
      <div class="chip-sel" id="chips" role="group" aria-label="Mức cược"><span>Mức cược:</span></div>
      <div class="bet-actions" role="group" aria-label="Thao tác cược">
        <button class="bet-action" id="undo-bet" type="button" title="Hoàn lại cược gần nhất" aria-label="Hoàn lại cược gần nhất" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 1 1-6.2 10.2"/></svg>
        </button>
        <button class="bet-action" id="double-bet" type="button" title="Nhân đôi cược gần nhất" aria-label="Nhân đôi cược gần nhất" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="17" text-anchor="middle" fill="currentColor" font-size="17" font-weight="800">×2</text></svg>
        </button>
      </div>
    </div>
    <div class="icobtn" title="Ngôn ngữ">🇬🇧</div>
    <div class="profile" title="Tài khoản">
      <span class="avatar">T</span>
      <span class="balance" id="bal">0.00</span>
    </div>
    <div class="icobtn" title="Menu">☰</div>
  </div>
</header>
<nav class="sidebar">
  <div class="side-ic" title="Trang chủ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>
  <div class="side-ic" title="Yêu thích"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/></svg></div>
  <div class="side-ic active" title="Game bàn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><rect x="8" y="3" width="14" height="12" rx="2"/><path d="M8 15h14"/></svg></div>

  <button class="side-tab" data-cat="bb"><span class="st-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><circle cx="7" cy="7" r="1"/><circle cx="17" cy="17" r="1"/></svg></span><span class="st-lb">Bac Bo</span></button>
  <button class="side-tab" data-cat="ab"><span class="st-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 7h8M8 17h8M8 12h8"/></svg></span><span class="st-lb">Andar Bahar</span></button>
  <button class="side-tab" data-cat="xd"><span class="st-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8.5" r="2.1"/><circle cx="15.5" cy="8.5" r="2.1"/><circle cx="8.5" cy="15.5" r="2.1"/><circle cx="15.5" cy="15.5" r="2.1"/></svg></span><span class="st-lb">Xóc Đĩa</span></button>
  <button class="side-tab" data-cat="xd-slot"><span class="st-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="16" height="14" rx="2"/><path d="M7 8v8M11 8v8M15 8v8M19 14h2V6"/><circle cx="21" cy="4" r="1.5"/></svg></span><span class="st-lb">Xóc Đĩa Slot</span></button>
  <button class="side-tab" data-cat="tx"><span class="st-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><g fill="currentColor" stroke="none"><circle cx="8" cy="8" r="1.5"/><circle cx="16" cy="8" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="8" cy="16" r="1.5"/><circle cx="16" cy="16" r="1.5"/></g></svg></span><span class="st-lb">Tài Xỉu</span></button>
  <button class="side-tab" data-cat="monopoly"><span class="st-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 17 17 7M7 7h.01M17 17h.01"/></svg></span><span class="st-lb">Monopoly</span></button>
  <button class="side-tab" data-cat="dt"><span class="st-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="8" height="15" rx="1.5" transform="rotate(-8 3 4)"/><rect x="13" y="4" width="8" height="15" rx="1.5" transform="rotate(8 13 4)"/><path d="M7 8h2M15 8h2"/></svg></span><span class="st-lb">Long Hổ</span></button>
  <button class="side-tab" data-cat="ft"><span class="st-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1.5 11h-11L5 8Z"/><path d="M8 8a4 4 0 0 1 8 0"/><circle cx="9" cy="12" r=".7" fill="currentColor"/><circle cx="12" cy="14" r=".7" fill="currentColor"/><circle cx="15" cy="12" r=".7" fill="currentColor"/></svg></span><span class="st-lb">Fantan</span></button>
  <div class="side-sep"></div>
  <button class="side-tab" data-cat="rl"><span class="st-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v5M21 12h-5M12 21v-5M3 12h5M5.6 5.6l3.5 3.5M18.4 5.6l-3.5 3.5M18.4 18.4l-3.5-3.5M5.6 18.4l3.5-3.5"/></svg></span><span class="st-lb">Roulette</span></button>
  <button class="side-tab" data-cat="bo"><span class="st-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18h18M5 15l4-5 3 2 6-7"/><path d="M14 5h4v4"/></svg></span><span class="st-lb">BO Nhị phân</span></button>
  <button class="side-tab" data-cat="crash"><span class="st-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c-4.8 0-8 3.2-8 7.2 0 3.3 2 5.8 5 6.8l1.2 3h3.6l1.2-3c3-1 5-3.5 5-6.8C20 6.2 16.8 3 12 3Z"/><path d="M9 20h6M12 17v3"/><path d="M11 11l2-3 2 3-2 3-2-3Z"/></svg></span><span class="st-lb">Game Crash</span></button>
  <div class="side-ic" title="Nạp tiền"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg></div>
  <div class="side-ic" title="Lịch sử"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div>
  <div class="side-ic" title="Cài đặt"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></div>
